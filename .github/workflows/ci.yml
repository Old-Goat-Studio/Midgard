# SPDX-License-Identifier: Apache-2.0
# Phase 0 exit criterion: green on Linux and Windows, and both halves build from a clean checkout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, licences and formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest clang-format==18.1.8
      - name: Ruff
        run: ruff check .
      - name: Licence check (third-party list, allowed licences, SPDX headers)
        run: python tools/licenses.py check
      - name: Licence tool tests
        run: pytest tools -q
      - name: clang-format
        run: find engine -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  editor:
    name: Editor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e "editor[dev]"
      - run: python -m midgard_editor --version
      - run: pytest editor -q

  package-editor:
    name: Package editor (${{ matrix.os }})
    needs: editor
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e "editor[dev]"
      - name: Package (editor only; engine templates arrive in Phase 2)
        run: python tools/package.py --no-bump --skip-engine
      - name: Smoke test the packaged editor (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/dist/Midgard/Midgard --smoke-test "$RUNNER_TEMP/smoke"
          cat "$RUNNER_TEMP/smoke/smoke_test.json"
      - name: Smoke test the packaged editor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          $p = Start-Process build/dist/Midgard/Midgard.exe -ArgumentList "--smoke-test", $dir -Wait -PassThru
          Get-Content (Join-Path $dir "smoke_test.json")
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: Midgard-editor-${{ runner.os }}
          path: build/dist/Midgard

  engine:
    name: Engine (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: windows-release }
          - { os: ubuntu-24.04, preset: linux-release }
          - { os: ubuntu-24.04-arm, preset: linux-arm64-release }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ninja, SDL3 window-system headers and software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxft-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            mesa-vulkan-drivers
      - uses: seanmiddleditch/gha-setup-ninja@v5
        if: runner.os == 'Windows'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Use the system's cmake and ninja for vcpkg on ARM
        if: runner.arch == 'ARM64'
        run: echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
      - run: python tools/setup_vcpkg.py
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: Runtime reports its version
        shell: bash
        run: build/${{ matrix.preset }}/engine/midgard_runtime --version
      - name: Render the demo scene offscreen with software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          build/${{ matrix.preset }}/engine/midgard_runtime --screenshot "$RUNNER_TEMP/render.png" --size 640x360
          pip install --quiet pillow
          python tools/check_render.py "$RUNNER_TEMP/render.png"
      - name: Upload the rendered image
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.preset }}
          path: ${{ runner.temp }}/render.png

  android:
    name: Engine (android-arm64, NDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Use the runner's latest NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-arm64-${{ hashFiles('vcpkg.json') }}
      - run: python tools/setup_vcpkg.py
      - run: cmake --preset android-arm64
      - run: cmake --build --preset android-arm64
