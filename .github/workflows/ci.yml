# SPDX-License-Identifier: Apache-2.0
# Phase 0 exit criterion: green on Linux and Windows, and both halves build from a clean checkout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, licences and formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest clang-format==18.1.8
      - name: Ruff
        run: ruff check .
      - name: Licence check (third-party list, allowed licences, SPDX headers)
        run: python tools/licenses.py check
      - name: Licence tool tests
        run: pytest tools -q
      - name: clang-format
        run: find engine -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  editor:
    name: Editor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e "editor[dev]"
      - run: python -m midgard_editor --version
      - run: pytest editor -q

  package-editor:
    name: Package editor (${{ matrix.os }})
    needs: editor
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e "editor[dev]"
      - name: Package (editor only; engine templates arrive in Phase 2)
        run: python tools/package.py --no-bump --skip-engine
      - name: Smoke test the packaged editor (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/dist/Midgard/Midgard --smoke-test "$RUNNER_TEMP/smoke"
          cat "$RUNNER_TEMP/smoke/smoke_test.json"
      - name: Smoke test the packaged editor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          $p = Start-Process build/dist/Midgard/Midgard.exe -ArgumentList "--smoke-test", $dir -Wait -PassThru
          Get-Content (Join-Path $dir "smoke_test.json")
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: Midgard-editor-${{ runner.os }}
          path: build/dist/Midgard

  engine:
    name: Engine (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: windows-release }
          - { os: ubuntu-24.04, preset: linux-release }
          - { os: ubuntu-24.04-arm, preset: linux-arm64-release }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ninja, SDL3 window-system headers and software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxft-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            mesa-vulkan-drivers libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0
      - uses: seanmiddleditch/gha-setup-ninja@v5
        if: runner.os == 'Windows'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Use the system's cmake and ninja for vcpkg on ARM
        if: runner.arch == 'ARM64'
        run: echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
      - run: python tools/setup_vcpkg.py
      - name: pybind11 (for the editor's _midgard engine module and the runtime)
        run: pip install "pybind11>=2.13"
      - name: Cache the game's Python download
        uses: actions/cache@v4
        with:
          path: .tools/python/*.tar.gz
          key: game-python-${{ matrix.preset }}-${{ hashFiles('tools/setup_python.py') }}
      - name: The game's Python (python-build-standalone, pinned)
        run: python tools/setup_python.py
      - run: cmake --preset ${{ matrix.preset }} -DMIDGARD_REQUIRE_PYTHON=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: Runtime reports its version
        shell: bash
        run: build/${{ matrix.preset }}/engine/midgard_runtime --version
      - name: Runtime starts the game's Python
        shell: bash
        run: build/${{ matrix.preset }}/engine/midgard_runtime --check-python
      - name: Game scripts with this engine (triggers, errors, reload while playing, API stub)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MIDGARD_REQUIRE_ENGINE: "1"
        run: |
          set -o pipefail
          # Only what these tests use: not the docking library (PySide6-QtAds, which has no
          # matching wheel on every runner and would be compiled) or the packaging tools.
          pip install --quiet --no-deps -e editor 2>&1 | tee "$RUNNER_TEMP/scripting.log"
          pip install --quiet "PySide6>=6.8" "jsonschema>=4.21" "cryptography>=43"             "jedi>=0.19" pytest pytest-qt 2>&1 | tee -a "$RUNNER_TEMP/scripting.log"
          pytest editor/tests/test_scripting.py -q -rA --junitxml="$RUNNER_TEMP/scripting.xml" \
            2>&1 | tee -a "$RUNNER_TEMP/scripting.log"
      - name: Show failed script tests as annotations
        if: failure()
        shell: bash
        run: |
          python tools/junit_annotations.py "$RUNNER_TEMP/scripting.xml" \
            --log "$RUNNER_TEMP/scripting.log" || true
      - name: Runtime template (for Build > Export)
        run: python tools/make_template.py --preset ${{ matrix.preset }}
      - name: Upload the runtime template
        uses: actions/upload-artifact@v4
        with:
          name: runtime-template-${{ matrix.preset }}
          path: build/templates/*.zip
      - name: Render the demo scene offscreen with software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          build/${{ matrix.preset }}/engine/midgard_runtime --screenshot "$RUNNER_TEMP/render.png" --size 640x360
          pip install --quiet pillow
          python tools/check_render.py "$RUNNER_TEMP/render.png"
      - name: Upload the rendered image
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.preset }}
          path: ${{ runner.temp }}/render.png

  android:
    name: Engine (android-arm64, NDK)
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ninja and the Qt runtime libraries (for the editor's export)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libegl1 libgl1 libxkbcommon0 libdbus-1-3             libfontconfig1 libglib2.0-0
      - name: Use the runner's latest NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-arm64-${{ hashFiles('vcpkg.json') }}
      - run: python tools/setup_vcpkg.py
      - name: pybind11 (headers for the runtime's scripting)
        run: pip install "pybind11>=2.13"
      - name: Cache the game's Python download
        uses: actions/cache@v4
        with:
          path: .tools/python/*.tar.gz
          key: game-python-android-arm64-${{ hashFiles('tools/setup_python.py') }}
      - name: The game's Python for Android (python.org's official build, pinned)
        run: python tools/setup_python.py --target android-arm64
      - name: Configure
        run: |
          set -o pipefail
          cmake --preset android-arm64 -DMIDGARD_REQUIRE_PYTHON=ON 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset android-arm64 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Show a failed configure or build as an annotation
        if: failure()
        run: python tools/junit_annotations.py "$RUNNER_TEMP/none.xml" --log "$RUNNER_TEMP/build.log" || true
      - name: Runtime template (template APK, for Build > Export)
        run: python tools/make_template.py --preset android-arm64
      - name: Upload the runtime template
        uses: actions/upload-artifact@v4
        with:
          name: runtime-template-android-arm64
          path: build/templates/*.zip
      - name: Export a sample game with the editor, as a user would
        run: |
          pip install -e editor
          python - "$RUNNER_TEMP/projects" <<'PY'
          import sys
          from pathlib import Path
          from PySide6.QtCore import QCoreApplication
          from midgard_editor.project import Project
          app = QCoreApplication([])
          project = Project.create(Path(sys.argv[1]), "HelloCube", "system_map", "Hello Cube")
          # A script, so the APK must carry Python and the game's scripts/.
          (project.root / "scripts" / "spin.py").write_text(
              "def on_update(entity, dt):\n"
              "    x, y, z = entity.rotation\n"
              "    entity.rotation = (x, y + 90 * dt, z)\n", "utf-8")
          cube = project.entity("e000004")
          cube.components["script"] = {"module": "spin"}
          project.put_entity(cube)
          PY
          python -m midgard_editor export "$RUNNER_TEMP/projects/HelloCube/HelloCube.config"             --target android-arm64 --out "$RUNNER_TEMP/export"             --template build/templates/midgard-runtime-*-android-arm64.zip             --settings "$RUNNER_TEMP/settings"
      - name: Check the exported APK with the Android SDK's own tools
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls "$RUNNER_TEMP"/export/*.apk)
          "$TOOLS/zipalign" -c -v 4 "$APK" | tail -3
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 29 "$APK"
          "$TOOLS/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.example.hellocube'" "$RUNNER_TEMP/badging.txt"
          grep -q "application-label:'Hello Cube'" "$RUNNER_TEMP/badging.txt"
          unzip -l "$APK" | tee "$RUNNER_TEMP/apk.txt"
          for f in lib/arm64-v8a/libmain.so lib/arm64-v8a/libpython3.14.so assets/python.zip \
                   assets/data/files.txt assets/data/scripts/spin.py; do
            grep -q " $f\$" "$RUNNER_TEMP/apk.txt" || { echo "::error::$f is missing from the APK"; exit 1; }
          done
      - name: Upload the sample APK (install it on a phone to try it)
        uses: actions/upload-artifact@v4
        with:
          name: HelloCube-android-arm64
          path: ${{ runner.temp }}/export/*.apk
