[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "midgard-editor"
description = "The Midgard game editor"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Richard E Rogers" }]
maintainers = [{ name = "Old Goat Studio" }]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.8",
    "PySide6-QtAds>=4.3",
    "jsonschema>=4.21",
    "cryptography>=43",
    "jedi>=0.19",
]

[project.urls]
Homepage = "https://github.com/Old-Goat-Studio/Midgard"
Issues = "https://github.com/Old-Goat-Studio/Midgard/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "clang-format==18.1.8",
    "pyinstaller>=6.10",
    "pillow>=10",
    "pybind11>=2.13",
]

[project.scripts]
midgard-editor = "midgard_editor.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "midgard_editor.version.VERSION" }

[tool.setuptools.packages.find]
include = ["midgard_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["qt: needs the Qt libraries to load"]
