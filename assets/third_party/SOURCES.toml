# Third-party assets in this folder: models, animations, sounds, music and textures used by the
# engine's tests and the sample projects. Only CC0 (public domain) assets are accepted, and every
# file here needs an entry, which tools/licenses.py checks in CI. For example:
#
#   [[asset]]
#   path = "characters/universal_base.glb"   # relative to this folder
#   title = "Universal Base Characters"
#   author = "Quaternius"
#   source = "https://quaternius.com/packs/universalbasecharacters.html"
#   license = "CC0-1.0"
#
# A folder of files from one pack can be listed once, with path = "folder/" (ending in /).

[[asset]]
path = "models/avocado/"
title = "Avocado (glTF Sample Assets), textures reduced from 2048 to 512 pixels"
author = "Microsoft"
source = "https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/Avocado"
license = "CC0-1.0"

[[asset]]
path = "characters/quaternius/"
title = "Universal Base Characters (Superhero Male, packed from .gltf + .bin into .glb, base colour texture reduced from 2048 to 512 pixels) and Universal Animation Library (UAL1_Standard.glb, as is)"
author = "Quaternius"
source = "https://quaternius.com"
license = "CC0-1.0"

[[asset]]
path = "sounds/nox_footsteps/"
title = "Essentials Series: Footsteps (8 walking steps each on grass, rock, sand, snow and metal, encoded from WAV to Ogg Vorbis)"
author = "Nox Sound"
source = "https://www.asoundeffect.com/sounddesigner/nox-sound/"
license = "CC0-1.0"

[[asset]]
path = "sounds/nox_ambience/"
title = "Essentials Series: Nature and Atmosphere loops (meadow birds, forest birds, night, sea, calm wind, calm rain, sci-fi bunker, eerie drone; encoded from WAV to Ogg Vorbis)"
author = "Nox Sound"
source = "https://www.asoundeffect.com/sounddesigner/nox-sound/"
license = "CC0-1.0"

[[asset]]
path = "sounds/music/"
title = "Desert Theme (caravan.ogg, as is)"
author = "yd"
source = "https://opengameart.org/content/desert-theme"
license = "CC0-1.0"
